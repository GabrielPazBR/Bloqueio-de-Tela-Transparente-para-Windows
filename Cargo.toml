[package]
name = "bloqueio-transparente"
version = "0.5.0-beta"
edition = "2024"
authors = ["Gabriel Paz"]
description = "Bloqueio transparente de teclado e mouse para Windows"
license = "MIT"

[lib]
name = "bloqueio_transparente"
path = "src/lib.rs"

[[bin]]
name = "BloqueioTransparente"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tempfile = "3.20"
zeroize = "1.8"
rpassword = "7.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authentication_Identity",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Com",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Environment",
  "Win32_System_EventLog",
  "Win32_System_Pipes",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_Registry",
  "Win32_System_Services",
  "Win32_System_Shutdown",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
windows-service = "0.8"
eframe = { version = "0.36.1", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Environment",
  "Win32_System_EventLog",
  "Win32_System_LibraryLoader",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_RemoteDesktop",
  "Win32_System_Registry",
  "Win32_System_Services",
  "Win32_System_Shutdown",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
